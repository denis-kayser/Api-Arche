name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build Docker (sin push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false 
          no-cache: true

      - name: Confirm build success
        run: echo "Build OK"

  code-quality:
    name: SonarCloud Analysis
    needs: test-and-build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para SonarCloud (analiza historial completo)

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automático de GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # El que acabas de crear

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarcloud-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build & Push Docker Image
    needs: code-quality  # Solo construye si pasa el análisis de código
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version tag
        id: version
        run: |
          # Obtener token
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\": \"${{ secrets.DOCKER_USERNAME }}\", \"password\": \"${{ secrets.DOCKER_PASSWORD }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          # Obtener el tag más reciente y sumar 1
          LATEST=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/jsherrcode/api-arche/tags?page_size=100" \
            | jq -r '.results[].name' | grep '^v1\.' | sort -rV | head -1)

          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.1"
          else
            NUM=$(echo $LATEST | sed 's/v1\.//')
            NEW_TAG="v1.$((NUM+1))"
          fi

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Nuevo tag: $NEW_TAG"

      - name: Build & Push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            jsherrcode/api-arche:latest
            jsherrcode/api-arche:${{ steps.version.outputs.new_tag }}
          cache-from: type=registry,ref=jsherrcode/api-arche:buildcache
          cache-to: type=registry,ref=jsherrcode/api-arche:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/api-arche
            docker compose pull
            docker compose up -d
            docker image prune -f
  
  cleanup:
    name: Cleanup Old Images
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Delete old images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: bash .github/scripts/cleanup.sh